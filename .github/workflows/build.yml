name: 构建游戏

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发

# 防止两次部署网页版互相打架
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 下载 Godot 引擎
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip -d godot
          chmod +x godot/Godot_v4.7.2-stable_linux.x86_64

      - name: 下载导出模板
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d tpz
          mv tpz/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: 导入资源并导出游戏
        run: |
          godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import
          mkdir -p build
          godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop"

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: my-survivors-windows
          path: build/
          # ⚠️ 免费额度只有 0.5GB 产物存储：每次推送都会产出一个 ~44MB 的 exe，
          # 默认保留 90 天会迅速撑爆（2026-09-24 踩过：87 个产物 3.1GB，Actions 存储 100%）。
          # 这里锁死 1 天；网页版的 github-pages 产物由 upload-pages-artifact 生成、
          # 不接这个参数，靠仓库默认保留期（也已设为 1 天）。
          retention-days: 1

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 下载 Godot 引擎
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip -d godot
          chmod +x godot/Godot_v4.7.2-stable_linux.x86_64

      - name: 下载导出模板
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d tpz
          mv tpz/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: 导入资源并导出网页版
        run: |
          godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import
          mkdir -p build/web
          godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Web"

      - name: 打包网页成品
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
